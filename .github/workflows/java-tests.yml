name: Java tests
on:
  pull_request:
  push:
    branches: [main, codex/server-round-result]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Server, game rules and TCP tests
        shell: pwsh
        run: ./server.ps1 -Task test
      - name: Swing integration tests
        run: xvfb-run -a pwsh -NoProfile -File ./server.ps1 -Task test-ui
      - name: Korean fonts for preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual Swing design
        run: xvfb-run -a java -Dfile.encoding=UTF-8 -cp build/tests/classes:build/tests/test-classes pacman.client.DesignPreview
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-design-preview
          path: build/previews/*.png
      - name: Build server JAR
        shell: pwsh
        run: ./server.ps1 -Task build
      - name: Compile all original Java sources
        shell: bash
        run: |
          mkdir -p build/all
          find src/java -name '*.java' > build/all-sources.txt
          javac -encoding UTF-8 -d build/all @build/all-sources.txt
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
